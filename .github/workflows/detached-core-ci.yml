name: MagicOs Core Detached CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  clean-build:
    runs-on: ubuntu-latest
    steps:
      - name: Hard Checkout & Deep Clean
        uses: actions/checkout@v4
        with:
          clean: true
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Execute Clean Manifest Merge & Assemble
        run: |
          GRADLEW_PATH=$(find . -name gradlew -print -quit)
          if [ -n "$GRADLEW_PATH" ]; then
            GRADLE_DIR=$(dirname "$GRADLEW_PATH")
            cd "$GRADLE_DIR"
            chmod +x gradlew
            ./gradlew --stop
            # Catch raw errors cleanly without the giant stack trace
            ./gradlew assembleDebug --no-build-cache -q > build_output.log 2>&1 || true
          else
            sudo apt-get update && sudo apt-get install -y gradle
            gradle assembleDebug --no-build-cache -q > build_output.log 2>&1 || true
          fi
          
          echo "=== CLEAN AGP BREAKAGE LOG ==="
          if [ -f build_output.log ]; then
            grep -E "AAPT:|error:|Failure|Manifest merger failed" build_output.log || head -n 40 build_output.log
          else
            echo "No log file generated."
          fi
          exit 1
