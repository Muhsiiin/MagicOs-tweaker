name: MagicOs Core Detached CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  clean-build:
    runs-on: ubuntu-latest
    steps:
      - name: Hard Checkout & Deep Clean
        uses: actions/checkout@v4
        with:
          clean: true
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Provision Modern Android Gradle Distribution
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Execute Clean Manifest Merge & Assemble
        run: |
          echo "Compiling layout module configurations..."
          gradle :app:assembleDebug --no-build-cache > build_debug.log 2>&1 || true
          
          echo "=== ACTUAL MANIFEST MERGER / AAPT ERROR ==="
          if grep -q "What went wrong:" build_debug.log; then
            sed -n '/What went wrong:/,/Get more help at/p' build_debug.log
          else
            grep -i -E "error|failed|exception|manifest|line" build_debug.log | head -n 40
          fi
          echo "=========================================="
          exit 1
