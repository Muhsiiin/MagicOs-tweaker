name: MagicOs Core Detached CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  clean-build:
    runs-on: ubuntu-latest
    steps:
      - name: Hard Checkout & Deep Clean
        uses: actions/checkout@v4
        with:
          clean: true
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Execute Clean Manifest Merge & Assemble
        run: |
          echo "Searching entire repository for gradlew..."
          GRADLEW_PATH=$(find . -name gradlew -print -quit)
          
          if [ -n "$GRADLEW_PATH" ]; then
            GRADLE_DIR=$(dirname "$GRADLEW_PATH")
            echo "Found gradlew wrapper at: $GRADLEW_PATH"
            cd "$GRADLE_DIR"
            chmod +x gradlew
            ./gradlew --stop
            ./gradlew assembleDebug --no-build-cache --stacktrace
          else
            echo "Gradle wrapper missing. Falling back to system gradle distribution..."
            sudo apt-get update && sudo apt-get install -y gradle
            gradle --stop || true
            gradle assembleDebug --no-build-cache --stacktrace
          fi
