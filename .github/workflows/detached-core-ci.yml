name: MagicOs Core Detached CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  clean-build:
    runs-on: ubuntu-latest
    steps:
      - name: Hard Checkout & Deep Clean
        uses: actions/checkout@v4
        with:
          clean: true
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Provision Modern Android Gradle Distribution
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Execute Clean Manifest Merge & Assemble
        run: |
          echo "Compiling layout configurations..."
          gradle :app:processDebugMainManifest --stacktrace > manifest_build.log 2>&1 || true
          
          echo "=== COMPLETE RAW MANIFEST LOG ==="
          cat manifest_build.log
          echo "================================="
          exit 1
