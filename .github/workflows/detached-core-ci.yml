name: MagicOs Core Detached CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  clean-build:
    runs-on: ubuntu-latest
    steps:
      - name: Hard Checkout & Deep Clean
        uses: actions/checkout@v4
        with:
          clean: true
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Execute Clean Manifest Merge & Assemble
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gradle
          
          echo "Compiling structure and writing log..."
          gradle build -x test --no-build-cache --stacktrace > full_build.log 2>&1 || true
          
          echo "=== CORE SOURCE COMPILE ERROR ==="
          tail -n 60 full_build.log
          echo "=== END LOG ==="
          exit 1
