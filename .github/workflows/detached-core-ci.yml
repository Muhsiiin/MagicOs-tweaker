name: CI Force Clean

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Base
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: 1
        clean: true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Force Patch Deep Submodule Directory Manifest
      run: |
        # Explicitly build out the exact target paths in the workspace
        mkdir -p app/src/main
        mkdir -p MagicOs-tweaker/app/src/main
        
        MANIFEST_CONTENT="<?xml version=\"1.0\" encoding=\"utf-8\"?>
        <manifest xmlns:android=\"http://android.com\"
            package=\"com.muhsiin.magicos_tweaker\">
            <application
                android:allowBackup=\"true\"
                android:icon=\"@mipmap/ic_launcher\"
                android:label=\"@string/app_name\"
                android:roundIcon=\"@mipmap/ic_launcher_round\"
                android:supportsRtl=\"true\"
                android:theme=\"@style/Theme.MagicOsTweaker\">
                <activity
                    android:name=\".MainActivity\"
                    android:exported=\"true\">
                    <intent-filter>
                        <action android:name=\"android.intent.action.MAIN\" />
                        <category android:name=\"android.intent.category.LAUNCHER\" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>"

        # Overwrite all manifestations right before execution
        echo "$MANIFEST_CONTENT" > app/src/main/AndroidManifest.xml
        echo "$MANIFEST_CONTENT" > MagicOs-tweaker/app/src/main/AndroidManifest.xml

    - name: Target Submodule Context Project Build
      run: gradle assembleDebug -p MagicOs-tweaker --no-build-cache --no-daemon
