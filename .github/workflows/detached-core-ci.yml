name: CI Force Clean

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Root Code Base Only
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: 1
        clean: true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Run Build and Inject Manifest Fix
      run: |
        # Define the proper manifest layout structure
        MANIFEST_CONTENT="<?xml version=\"1.0\" encoding=\"utf-8\"?>
        <manifest xmlns:android=\"http://android.com\"
            package=\"com.muhsiin.magicos_tweaker\">
            <application
                android:allowBackup=\"true\"
                android:icon=\"@mipmap/ic_launcher\"
                android:label=\"@string/app_name\"
                android:roundIcon=\"@mipmap/ic_launcher_round\"
                android:supportsRtl=\"true\"
                android:theme=\"@style/Theme.MagicOsTweaker\">
                <activity
                    android:name=\".MainActivity\"
                    android:exported=\"true\">
                    <intent-filter>
                        <action android:name=\"android.intent.action.MAIN\" />
                        <category android:name=\"android.intent.category.LAUNCHER\" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>"

        # Run compilation tasks up until manifest extraction to let Gradle build directories
        gradle :app:extractDeepLinksDebug --no-build-cache --no-daemon || true

        # Force write the fixed layout directly over both paths right before the merger runs
        mkdir -p app/src/main
        echo "$MANIFEST_CONTENT" > app/src/main/AndroidManifest.xml

        mkdir -p MagicOs-tweaker/app/src/main
        echo "$MANIFEST_CONTENT" > MagicOs-tweaker/app/src/main/AndroidManifest.xml

        # Resume the full assembly build execution
        gradle assembleDebug --no-build-cache --no-daemon
