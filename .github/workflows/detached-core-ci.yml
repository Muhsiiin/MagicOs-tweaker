name: MagicOs Core Detached CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  clean-build:
    runs-on: ubuntu-latest
    steps:
      - name: Hard Checkout & Deep Clean
        uses: actions/checkout@v4
        with:
          clean: true
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Provision Modern Android Gradle Distribution
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Execute Clean Manifest Merge & Assemble
        run: |
          echo "Compiling layout module configurations..."
          # Run with --info flag so AGP outputs the explicit manifest merge failure reasons
          gradle :app:processDebugMainManifest --info > manifest_build.log 2>&1 || true
          
          echo "=== EXPLICIT MANIFEST MERGE CONFLICT REPORT ==="
          if grep -q "Manifest merger failed" manifest_build.log; then
            # Extract the actual structural error details below the merge failure block
            grep -A 25 "Manifest merger failed" manifest_build.log
          else
            # Fallback to outputting lines highlighting missing configurations or attributes
            grep -i -E "error:|is missing|attribute|mismatch|conflict" manifest_build.log | head -n 40
          fi
          echo "================================================"
          exit 1
