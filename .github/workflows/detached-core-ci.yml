name: CI Force Clean

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Base
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: 0
        clean: true

    - name: Overwrite Broken Submodule Manifest
      run: |
        mkdir -p MagicOs-tweaker/app/src/main
        cat << 'EOF' > MagicOs-tweaker/app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://android.com"
            package="com.muhsiin.magicos_tweaker">
            <application
                android:allowBackup="true"
                android:icon="@mipmap/ic_launcher"
                android:label="@string/app_name"
                android:roundIcon="@mipmap/ic_launcher_round"
                android:supportsRtl="true"
                android:theme="@style/Theme.MagicOsTweaker">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Invalidate AGP Manifest Cache
      working-directory: MagicOs-tweaker
      run: ./gradlew clean --no-build-cache --no-daemon

    - name: Force Build with AGP 8.2.2
      working-directory: MagicOs-tweaker
      run: ./gradlew assembleDebug --no-build-cache --stacktrace
