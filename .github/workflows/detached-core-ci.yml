name: MagicOs Core Detached CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  clean-build:
    runs-on: ubuntu-latest
    steps:
      - name: Hard Checkout & Deep Clean
        uses: actions/checkout@v4
        with:
          clean: true
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Provision Modern Android Gradle Distribution
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Execute Clean Manifest Merge & Assemble
        run: |
          echo "Compiling layout configurations..."
          # Running without standard stacktraces to stop terminal flooding
          gradle :app:processDebugMainManifest --no-build-cache > build_run.log 2>&1 || true
          
          echo "=== SEARCHING FOR ANDROID MERGE INSTANCE BLOCKS ==="
          # Locate the auto-generated merger issue text report file
          REPORT_FILE=$(find . -name "manifest-merger-*-report.txt" -o -name "manifest-merger-debug-report.txt" -print -quit)
          
          if [ -n "$REPORT_FILE" ] && [ -f "$REPORT_FILE" ]; then
            echo "Found Report at: $REPORT_FILE"
            grep -A 20 -i "error" "$REPORT_FILE" || tail -n 50 "$REPORT_FILE"
          else
            echo "No explicit report file found. Inspecting build output log..."
            # Print only non-stacktrace lines containing common compilation/manifest errors
            grep -v "at org.gradle" build_run.log | grep -v "at java." | grep -A 5 -B 2 -i "failed" || head -n 50 build_run.log
          fi
          echo "==================================================="
          exit 1
