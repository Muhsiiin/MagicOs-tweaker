name: Build Android App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: false

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Absolute Deep Space Overwrite
      run: |
        # 1. Create a pristine, isolated temporary manifest layout
        cat << 'EOF' > /tmp/perfect_manifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://android.com">
            <application
                android:allowBackup="true"
                android:icon="@mipmap/ic_launcher"
                android:label="MagicOs-tweaker"
                android:roundIcon="@mipmap/ic_launcher_round"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                <activity
                    android:name="com.muhsilin.magicos_tweaker.MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 2. Globally find EVERY file matching AndroidManifest.xml and forcefully swap it
        echo "=== Launching cross-directory file purge ==="
        find /home/runner/work -name "AndroidManifest.xml" -type f -exec cp -fv /tmp/perfect_manifest.xml {} \;

    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 8.2

    - name: Grant Execute Permission to Gradlew
      run: chmod +x gradlew

    - name: Build Debug APK with Gradle
      run: ./gradlew :app:assembleDebug
