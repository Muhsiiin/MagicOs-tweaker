name: CI Force Clean

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Root Code Base Only
      uses: actions/checkout@v4
      with:
        submodules: 'false'  # Do not fetch the broken nested submodule repository
        fetch-depth: 1
        clean: true

    - name: Reconstruct Fresh Clean Android Structure
      run: |
        # Completely remove any ghost/broken nested structures if present
        rm -rf MagicOs-tweaker
        
        # Build a fresh, clean app directory at the root level
        mkdir -p app/src/main
        
        # Generate the fully compliant Android Manifest file directly
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://android.com"
            package="com.muhsiin.magicos_tweaker">
            <application
                android:allowBackup="true"
                android:icon="@mipmap/ic_launcher"
                android:label="@string/app_name"
                android:roundIcon="@mipmap/ic_launcher_round"
                android:supportsRtl="true"
                android:theme="@style/Theme.MagicOsTweaker">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Clean and Build
      run: gradle assembleDebug --no-build-cache --no-daemon
