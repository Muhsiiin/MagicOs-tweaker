name: CI Force Clean Diagnostic

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Base Flatly
      uses: actions/checkout@v4
      with:
        submodules: 'false'
        fetch-depth: 1
        clean: true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Extract Clean Workspace and Patch
      run: |
        mkdir -p isolated-build/app
        cp -f build.gradle isolated-build/ 2>/dev/null || true
        cp -f build.gradle.kts isolated-build/ 2>/dev/null || true
        cp -f settings.gradle isolated-build/ 2>/dev/null || true
        cp -f settings.gradle.kts isolated-build/ 2>/dev/null || true
        cp -rf gradle isolated-build/ 2>/dev/null || true
        cp -f gradlew isolated-build/ 2>/dev/null || true
        cp -R app/. isolated-build/app/ 2>/dev/null || true
        
        mkdir -p isolated-build/app/src/main
        cat << 'EOF' > isolated-build/app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://android.com"
            package="com.muhsiin.magicos_tweaker">
            <application
                android:allowBackup="true"
                android:icon="@mipmap/ic_launcher"
                android:label="@string/app_name"
                android:roundIcon="@mipmap/ic_launcher_round"
                android:supportsRtl="true"
                android:theme="@style/Theme.MagicOsTweaker">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        if [ -f isolated-build/settings.gradle ]; then
          sed -i '/:MagicOs-tweaker/d' isolated-build/settings.gradle
          sed -i '/MagicOs-tweaker/d' isolated-build/settings.gradle
        fi
        if [ -f isolated-build/settings.gradle.kts ]; then
          sed -i '/:MagicOs-tweaker/d' isolated-build/settings.gradle.kts
          sed -i '/MagicOs-tweaker/d' isolated-build/settings.gradle.kts
        fi

    - name: Execute Standalone Build Pipeline
      working-directory: isolated-build
      run: |
        if [ -f ./gradlew ]; then
          chmod +x gradlew
          ./gradlew assembleDebug --no-build-cache --no-daemon > build_log.txt 2>&1 || true
        else
          gradle assembleDebug --no-build-cache --no-daemon > build_log.txt 2>&1 || true
        fi

        echo "=================== BUILD OUTPUT SUMMARY ==================="
        tail -n 40 build_log.txt

        echo "=================== EXTRACTED COMPILATION ERRORS ==================="
        grep -i -E "error:|failed|exception" build_log.txt | head -n 30

        if grep -q "BUILD SUCCESSFUL" build_log.txt; then
          echo "Build completed successfully!"
        else
          exit 1
        fi
